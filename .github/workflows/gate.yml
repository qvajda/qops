# RENDERED BY `qops install` from qops/templates/gate.yml.tmpl + .qops/config.yml
# Do not hand-edit: `qops doctor` fails on drift.
#
# The machine gate. A taste review is legitimate only once every
# machine-checkable precondition is green (S4).
name: gate

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # Shallow: nothing the gate runs reads history. `qops doctor` compares
      # the rendered workflows with the templates and the docs on disk, and
      # python -m pytest -q tests/test_qops.py touches no merge base.
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: install
        # One block for every rendered job that runs Python, rendered from
        # `qops/install.py:INSTALL_DEPS` (ADR-0024). Three copies of it drifted
        # into three separate failures in repos shaped unlike this one.
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt
          elif [ -f pyproject.toml ]; then pip install -e .
          else pip install pyyaml; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
      - name: qops doctor — workflows match the config, hooks installed, docs resolve
        run: python -m qops doctor
      - name: substrate tests
        run: python -m pytest -q tests/test_qops.py
