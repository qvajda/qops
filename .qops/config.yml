# qops project configuration — TRACKED.
#
# This file is the ONLY place a project specific may live. The CLI, the hooks
# and the rendered workflows read it; none of them carries a project name, a
# path, an interpreter or a threshold of its own. `tests/test_qops.py` asserts
# that property rather than measuring it once.
#
# This is qops configuring itself. Read `docs/reference/qops-contract.md` for
# what every key means; this file is the worked example of it.

project: qops
repo: qvajda/qops
prd: docs/prd/2026-08-20-eligibility-pipeline.md
default_branch: master

# The interpreter the hooks and the shims invoke. `python3` on the cron host is
# the Windows Store stub, and a hardcoded absolute path is not committable — the
# py launcher is the portable middle (ADR-0009).
python: py -3
python_posix: python3

# Whether this project keeps a picker on the host at all. `qops install`
# registers `pickup-loop`'s scheduled task from this config (ADR-0032); set
# false and no install anywhere touches the machine's scheduler. A standing
# project decision, so it is a key and not a flag — install is run by sorties
# and by CI as well as by hand, and a flag that must be remembered every time
# is remembered none of them. Removal still works with it false:
# `qops install --unregister-task`, and `doctor` names a task left behind.
pickup_task: true

# Whether the registered pickup task passes `--launch`. Default off, and that
# is the safety valve: the flagless form prints what it would have picked and
# spends nothing, so the schedule can be proved to fire without starting an
# agent. The hand-registered task baked `--launch` in, which made the dry run
# unreachable from the schedule (#12). Registering never enables either way.
pickup_launch: true

# --- guard -----------------------------------------------------------------
protected_branches: [master]
max_worktrees: 2

# **No tripwires, and that is the point.** A tripwire is a project's constraint
# — a vendor call, a licence, a placeholder id — and the substrate has none of
# its own. `qops guard scan` exits 0 against this list; before Phase 8 P8.1 that
# path had never been exercised, and a crashing guard job would have failed
# every build here from the first push.
tripwires: []

scan_exclude:
  - CLAUDE.md
  - README.md
  - docs/
  - qops/
  - .qops/
  - tests/

# --- portability -----------------------------------------------------------
# The word list `tests/test_qops.py` asserts substrate source against. Empty
# here: this repo IS the substrate, so it has no project vocabulary to leak.
# A consuming project fills this in with its own vendors and its own name.
portability_forbidden: []

# --- skills (ADR-0018) -----------------------------------------------------
# Native only. The seven external skills are model and image tooling with no
# use in a substrate repo, and `skill_drift` fails on a lock entry outside the
# declared set — so `skills-lock.json` here is the mechanism with an empty map.
skills:
  native: [interview, spec-to-issue, triage]
  external: []

# --- hot path --------------------------------------------------------------
claude_md_max_lines: 150

# guard.yml's doc-link check: every docs/*.md path cited from these trees must
# resolve.
doc_link_roots: [qops, scripts, tests]

# How long the brief stays quiet about `pickup-loop` before it says the loop has
# not completed a run. Read as state, not as a schedule: the picker records a
# heartbeat when a run finishes, and the absence of a recent one is the report.
# That is the only shape that catches a run which died before it could speak —
# a bad interpreter, a missing root, an import that raises (#76). A repo whose
# loop has never run is silent, because it ships disabled and never nagging
# about it is the point.
pickup_max_silence_hours: 3

# --- CI --------------------------------------------------------------------
ci:
  python_version: '3.12'
  test_command: python -m pytest -q
  gate_command: python -m pytest -q tests/test_qops.py
  runs_on: ubuntu-latest
  digest_cron: '0 6 * * *'      # 06:00 UTC daily - the RECONCILER's cadence
  # Extraction criterion 7: one digest, not two. The shop has a daily rhythm and
  # is where the owner's morning attention goes; the substrate is worked in
  # bursts, and a second 06:00 UTC digest doubled the thing that criterion
  # exists to prevent. `qops` renders its digest on demand
  # (`gh workflow run digest.yml`) and reconciles on the cron regardless.
  digest_posts_on_schedule: false
  groom_cron: '0 5 * * 1'       # Mondays
  status_issue_label: 'qops:status'

# --- agents ----------------------------------------------------------------
# effort: start high, drop where quality holds, xhigh only for demanding
# agentic work. This is the project's only real cost control.
agents:
  planner:
    model: opus
    effort: high
    tools: [Read, Grep, Glob, Bash, WebFetch]
  coder:
    model: sonnet
    effort: medium
    tools: [Read, Edit, Write, Grep, Glob, Bash]
  reviewer:
    model: sonnet
    effort: high
    tools: [Read, Grep, Glob, Bash]
  scribe:
    model: haiku
    effort: low
    tools: [Read, Edit, Write, Bash]
  triager:
    model: sonnet
    effort: low
    tools: [Bash, Read, Grep]
  interactor:
    model: haiku
    effort: low
    tools: [Bash, Read]
delegation_cap: 1

# --- taxonomy --------------------------------------------------------------
labels:
  type: [epic, research, code, manual, test, decision]
  state: [triage, planned, building, gate, review, blocked, done, cancelled]
  mission: [substrate, consumers, housekeeping]
  gate: [machine, taste, none]
  # ADR-0023, amended by ADR-0029: whose licence covers the row, not who typed
  # it. `pending` is filed when a session cannot honestly claim `owner` and a
  # parent is intended; `qops reconcile` derives it to the parent's `origin:`
  # from a native sub-issue link, never from a claim.
  origin: [owner, agent, pending]
  # Optional and zero-or-one, deliberately NOT in `require_on_open`: an
  # unlabelled row is normal priority. `critical` is #106's, not this one's.
  priority: [parked]
  # Every label named anywhere in this file must appear here; `qops doctor`
  # asserts it. `qops:status` lived only under `ci:` in the source repo, so the
  # importer never created it and the daily digest failed for weeks (#136).
  flags: [ready:auto, no-auto, fork, budget:approved, qops:status]

milestones: [substrate, consumers, housekeeping]

# Every OPEN issue must carry exactly one type:, one state:, one gate: and one
# origin:. gate:none is legal at import and blocks ready:auto until it is filled
# in when the sortie is planned.
validate:
  require_on_open: [type, state, gate, origin]
  forbid_at_import: [ready:auto]
